[project]
name = "thoughtseeds-model"
version = "1.0.0"
description = "Three-layer dual-process computational model of focused-attention meditation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kavi, P. C." },
    { name = "Friedman, D. A." },
    { name = "Patow, G." },
]
dependencies = [
    "numpy>=1.25,<2.0",
    "matplotlib>=3.8,<4.0",
    "torch>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "seaborn>=0.13,<1.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "experiments", "model", "utils", "viz"]
